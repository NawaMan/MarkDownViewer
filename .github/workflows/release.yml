name: Release

on:
  push:
    tags: ["v*"]
  # The tag is derived from version.txt, so there is nothing to mistype.
  # Dispatch from any ref whose version.txt names the release.
  workflow_dispatch:
    inputs:
      force:
        description: Replace the release if it already exists
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 brings the tags along, which the dispatch path needs to
      # resolve and check out the tag named by version.txt.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve the tag
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            tag="${GITHUB_REF_NAME}"
            echo "Tag push: ${tag}"
          else
            tag="v$(tr -d ' \t\n\r' < version.txt)"
            echo "Dispatch: version.txt names ${tag}"
            if ! git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
              echo "::error::tag ${tag} does not exist — create and push it first"
              exit 1
            fi
            # Build the tagged commit, not whatever the dispatch ref points at.
            git checkout -q "refs/tags/${tag}"
          fi
          echo "TAG=${tag}" >> "$GITHUB_ENV"

      # version.txt is the single source of truth for the version the binary
      # reports, so a tag that disagrees with it would ship a mislabelled build.
      # Re-checked after the checkout above, which may have moved the worktree.
      - name: Check version.txt matches the tag
        run: |
          want="${TAG#v}"
          got="$(tr -d ' \t\n\r' < version.txt)"
          if [ "$want" != "$got" ]; then
            echo "::error::tag ${TAG} implies version ${want}, but version.txt says ${got}"
            exit 1
          fi
          echo "Releasing viewmd ${got}"

      - name: Test
        run: go test ./...

      - name: Build all platforms
        run: ./build.sh --all

      - name: Checksums
        working-directory: bin
        run: |
          sha256sum viewmd-* > SHA256SUMS
          cat SHA256SUMS

      # Confirm the shipped binary reports the version it claims to be.
      - name: Smoke-test the linux binary
        run: |
          got="$(./bin/viewmd-linux-amd64 version)"
          [ "$got" = "${TAG#v}" ] || { echo "::error::binary reports ${got}, expected ${TAG#v}"; exit 1; }

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE: ${{ inputs.force }}
        run: |
          # Tag pushes carry no inputs; default to the same "don't clobber"
          # behaviour as an unticked box.
          force="${FORCE:-false}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ "$force" != "true" ]; then
              echo "::error::release ${TAG} already exists (re-run with \"force\" enabled to replace it)"
              exit 1
            fi
            echo "Release ${TAG} exists — replacing it"
            # Deletes only the release; the git tag itself stays put.
            gh release delete "$TAG" --yes
          fi
          gh release create "$TAG" \
            bin/viewmd-* bin/SHA256SUMS \
            --title "viewmd ${TAG}" \
            --generate-notes

      # A rolling release under the `latest` tag, so download URLs never need
      # editing. Recreated each time because its tag has to move; --latest=false
      # keeps the "Latest" badge (and /releases/latest) on the versioned one.
      - name: Update the rolling "latest" release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Move the tag with git rather than letting the releases API create
          # the ref: creating a release against an existing tag is the path
          # that already works for the versioned release above.
          git tag -f latest "${TAG}^{commit}"
          git push -f origin refs/tags/latest

          gh release delete latest --yes 2>/dev/null || true
          gh release create latest \
            bin/viewmd-* bin/SHA256SUMS \
            --title "Latest (${TAG})" \
            --latest=false \
            --notes "Rolling release: always the newest tagged build, currently [\`${TAG}\`](../../releases/tag/${TAG}).

          Download URLs stay valid across versions:

          \`\`\`bash
          curl -LO https://github.com/${GITHUB_REPOSITORY}/releases/download/latest/viewmd-linux-amd64
          \`\`\`

          The \`latest\` git tag moves with every release, so \`git fetch --tags\` may need \`--force\`."
