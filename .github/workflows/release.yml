name: Release

on:
  push:
    tags: ["v*"]
  # The tag is derived from version.txt, so there is nothing to mistype.
  # Dispatch from any ref whose version.txt names the release.
  workflow_dispatch:
    inputs:
      force:
        description: Replace the release if it already exists
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  resolve:
    name: Resolve the tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      # fetch-depth: 0 brings the tags along, which the dispatch path needs to
      # resolve the tag named by version.txt.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # version.txt is the single source of truth for the version the binary
      # reports, so a tag that disagrees with it would ship a mislabelled build.
      - id: tag
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            tag="${GITHUB_REF_NAME}"
            echo "Tag push: ${tag}"
          else
            tag="v$(tr -d ' \t\n\r' < version.txt)"
            echo "Dispatch: version.txt names ${tag}"
            if ! git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
              echo "::error::tag ${tag} does not exist — create and push it first"
              exit 1
            fi
            # Judge the tagged commit, not whatever the dispatch ref points at.
            git checkout -q "refs/tags/${tag}"
          fi
          want="${tag#v}"
          got="$(tr -d ' \t\n\r' < version.txt)"
          if [ "$want" != "$got" ]; then
            echo "::error::tag ${tag} implies version ${want}, but version.txt says ${got}"
            exit 1
          fi
          echo "Releasing viewmd ${got}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

  # Tests, cross-compiles, and runs every binary on a native runner of its own
  # platform. Nothing is published unless all six actually start and serve.
  binaries:
    name: Binaries
    needs: resolve
    uses: ./.github/workflows/binaries.yml
    with:
      ref: refs/tags/${{ needs.resolve.outputs.tag }}

  publish:
    name: Publish
    needs: [resolve, binaries]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.resolve.outputs.tag }}

      # The very binaries the smoke jobs just ran, rather than a rebuild.
      - uses: actions/download-artifact@v4
        with:
          name: viewmd-binaries
          path: bin

      # The installers ship beside the binaries so the one-liner in the README
      # can fetch them from releases/latest/download/. Each carries the tag it
      # was published with, so a script pulled from a pinned release installs
      # that same release rather than drifting to the newest one.
      - name: Stage the installers
        run: |
          sed "s|^VERSION_DEFAULT=.*|VERSION_DEFAULT=${TAG}|" install.sh > bin/install.sh
          sed "s|^\$VersionDefault = .*|\$VersionDefault = '${TAG}'|" install.ps1 > bin/install.ps1
          chmod +x bin/install.sh
          grep -H "^VERSION_DEFAULT=\|^\$VersionDefault" bin/install.sh bin/install.ps1
          sh -n bin/install.sh
          pwsh -NoProfile -Command '
            $errs = $null
            [System.Management.Automation.Language.Parser]::ParseFile("bin/install.ps1", [ref]$null, [ref]$errs) > $null
            if ($errs) { $errs | ForEach-Object { $_.ToString() }; exit 1 }'

      - name: Checksums
        working-directory: bin
        run: |
          sha256sum viewmd-* install.sh install.ps1 > SHA256SUMS
          cat SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE: ${{ inputs.force }}
        run: |
          # Tag pushes carry no inputs; default to the same "don't clobber"
          # behaviour as an unticked box.
          force="${FORCE:-false}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ "$force" != "true" ]; then
              echo "::error::release ${TAG} already exists (re-run with \"force\" enabled to replace it)"
              exit 1
            fi
            echo "Release ${TAG} exists — replacing it"
            # Deletes only the release; the git tag itself stays put.
            gh release delete "$TAG" --yes
          fi
          # Claim the "Latest" badge only when this really is the highest
          # version, so re-releasing an older tag cannot displace a newer one.
          # That badge is what /releases/latest/download/<asset> resolves to,
          # which is why there is no separate rolling `latest` release (and a
          # `latest` tag could not be pushed by GITHUB_TOKEN anyway).
          published="$(gh release list --json tagName --jq '.[].tagName' 2>/dev/null || true)"
          # Pre-releases (v1.2.3-rc1) are excluded from the comparison: sort -V
          # ranks them above the final release, and they should never hold the
          # Latest badge regardless.
          highest="$(printf '%s\n%s\n' "$published" "$TAG" \
            | grep -v '^[[:space:]]*$' | grep -v '[-]' | sort -V | tail -1)"
          case "$TAG" in
            *-*)
              make_latest=false
              echo "${TAG} is a pre-release — not marking it Latest"
              ;;
            "$highest")
              make_latest=true
              echo "${TAG} is the highest version — marking it Latest"
              ;;
            *)
              make_latest=false
              echo "${TAG} is older than ${highest} — not marking it Latest"
              ;;
          esac

          gh release create "$TAG" \
            bin/viewmd-* bin/install.sh bin/install.ps1 bin/SHA256SUMS \
            --title "viewmd ${TAG}" \
            --latest="$make_latest" \
            --generate-notes

      # An installer that does not install is worse than no installer, so run
      # the published one against the release it just shipped with. The tag URL
      # is used rather than releases/latest, which a pre-release never becomes.
      - name: Verify the published installer
        run: |
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/install.sh"
          curl -fsSL "$url" -o /tmp/install.sh
          VIEWMD_INSTALL_DIR=/tmp/viewmd-install sh /tmp/install.sh
          got="$(/tmp/viewmd-install/viewmd version)"
          [ "$got" = "${TAG#v}" ] || { echo "::error::installer produced ${got}, expected ${TAG#v}"; exit 1; }
